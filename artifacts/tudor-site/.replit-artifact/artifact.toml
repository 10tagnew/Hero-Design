kind = "web"
previewPath = "/"
title = "Tudor Collegiate Strategies"
version = "1.0.0"
id = "artifacts/tudor-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19703

[services.development]
run = "pnpm --filter @workspace/tudor-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tudor-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/tudor-site/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19703"
BASE_PATH = "/"
